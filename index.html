<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>BLACKWALL</title>
<meta name="description" content="An ambient rendering of the Blackwall.">
<meta name="theme-color" content="#000000">
<style>
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;height:100%;width:100%;background:#000;overflow:hidden}
  canvas#gl{position:fixed;inset:0;width:100%;height:100%;display:block}
  /* faint anamorphic veil + tube interlace, purely optical */
  .veil{position:fixed;inset:0;pointer-events:none;mix-blend-mode:screen;
    background:
      radial-gradient(130% 75% at 58% 40%, rgba(255,24,40,.055) 0%, rgba(255,24,40,0) 64%),
      radial-gradient(95% 60% at 18% 82%, rgba(120,30,255,.045) 0%, rgba(120,30,255,0) 72%);
    animation:breathe 23s ease-in-out infinite}
  @keyframes breathe{0%,100%{opacity:.7}50%{opacity:1}}
  .crt{position:fixed;inset:0;pointer-events:none;opacity:.16;
    background:repeating-linear-gradient(180deg,rgba(0,0,0,0) 0 2px,rgba(0,0,0,.6) 3px,rgba(0,0,0,0) 4px)}
  @media (prefers-reduced-motion:reduce){.veil{animation:none}}
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div class="veil"></div>
<div class="crt"></div>

<script>
(function () {
"use strict";

const cvs = document.getElementById("gl");
const gl = cvs.getContext("webgl2", { antialias:false, alpha:false, powerPreference:"high-performance", desynchronized:true });
if (!gl) return;

const CALM = window.matchMedia("(prefers-reduced-motion: reduce)").matches ? 1.0 : 0.0;

/* ================================================================
   SHADERS
   ================================================================ */
const VERT = `#version 300 es
void main(){
  vec2 p = vec2((gl_VertexID<<1)&2, gl_VertexID&2);
  gl_Position = vec4(p*2.0-1.0, 0.0, 1.0);
}`;

const FRAG = `#version 300 es
precision highp float;
out vec4 O;

uniform vec2  uRes;
uniform float uT;
uniform float uPulse;
uniform float uEnter;
uniform float uCalm;
uniform float uBT;      // seconds since the current breach began
uniform vec2  uBP;      // where on the barrier it is pressing

#define PI 3.141592653589793

float hash11(float p){ p = fract(p*0.1031); p *= p+33.33; p *= p+p; return fract(p); }
float hash21(vec2 p){ vec3 q = fract(vec3(p.xyx)*vec3(0.1031,0.1030,0.0973));
                      q += dot(q, q.yzx+33.33); return fract((q.x+q.y)*q.z); }
float vnoise(float x){ float i=floor(x), f=fract(x); f=f*f*(3.0-2.0*f);
                       return mix(hash11(i), hash11(i+1.0), f); }

/* ---------------- one filament of the barrier ---------------- */
struct Col { vec3 c; float b; float w; };

Col column(float i, float v){
  float a = hash11(i*1.7  + 3.0);
  float b = hash11(i*3.1  + 11.0);
  float c = hash11(i*5.3  + 27.0);
  float d = hash11(i*7.9  + 53.0);

  /* hairlines mostly, a few heavier conduits */
  float w = 0.042 + 0.130*a*a*a;

  /* palette: arterial red dominant, magenta veins, rare cold ICE.
     desaturated slightly toward sensor response rather than pure primaries */
  float n = vnoise(i*0.062 + uT*0.011)*0.66 + vnoise(i*0.24 - uT*0.007)*0.34;
  vec3 red = vec3(1.00, 0.070, 0.100);
  vec3 mag = vec3(1.00, 0.105, 0.40);
  vec3 vio = vec3(0.62, 0.15, 0.95);
  vec3 ice = vec3(0.42, 0.70, 1.00);
  vec3 col = mix(red, mag, smoothstep(0.44, 0.74, n));
  col = mix(col, vio, smoothstep(0.80, 0.92, n));
  col = mix(col, ice, smoothstep(0.945, 0.995, n));

  /* traffic along the filament — continuous, faintly segmented */
  float dir = b > 0.5 ? 1.0 : -1.0;
  float y = v*2.35 + uT*(0.30 + 1.55*c)*dir*(1.0-0.7*uCalm) + d*17.0;
  float dv = fract(y);
  float seg = 1.0 - 0.28*(1.0 - smoothstep(0.03,0.26,dv)*smoothstep(1.00,0.74,dv));

  float pk = exp(-pow(fract(y*0.121)-0.5, 2.0)*82.0);

  float fl = 0.94 + 0.06*sin(uT*(1.1+4.4*b) + i*2.3);
  float drop = mix(1.0, step(0.022, hash11(floor(uT*2.2 + i*0.13) + i*1.9)), 0.55);

  float bri = (0.30 + 1.75*b*b) * seg * fl * drop;
  bri += pk * 1.10 * b;

  float scan = exp(-pow(fract(v*0.058 - uT*0.026)-0.5, 2.0)*62.0);
  bri *= 1.0 + scan*0.40;

  /* wide dormant zones — the barrier is not lit evenly across its span */
  bri *= smoothstep(0.08, 0.56, vnoise(i*0.0205 + uT*0.0055))*0.66 + 0.34;

  bri *= smoothstep(20.0, 1.5, v);
  bri *= 1.0 + uPulse*0.45;

  Col r; r.c = col; r.b = bri; r.w = w; return r;
}

/* ---------------- something pressing from the far side ----------------
   the barrier behaves like a pin board: each filament can only travel
   toward the viewer, so a body leaning on the back of it shows up as a
   dome, an expanding shock ring and a train of standing ripples.       */
float n2(vec2 p){
  vec2 i = floor(p), f = fract(p);
  f = f*f*(3.0-2.0*f);
  return mix(mix(hash21(i), hash21(i+vec2(1.0,0.0)), f.x),
             mix(hash21(i+vec2(0.0,1.0)), hash21(i+vec2(1.0,1.0)), f.x), f.y);
}
float fbm2(vec2 p){
  float s = 0.0, a = 0.5;
  for (int i = 0; i < 3; i++){ s += a*n2(p); p = p*2.07 + 7.1; a *= 0.5; }
  return s;
}
float breachEnv(){
  if (uBT < 0.0 || uBT > 10.0) return 0.0;
  return smoothstep(0.0, 0.20, uBT) * exp(-max(uBT-0.20, 0.0)*0.60);
}
float breachH(vec2 p){
  float env = breachEnv();
  if (env <= 0.0005) return 0.0;
  float sd = uBP.x*3.1 + uBP.y*7.7;
  vec2 q = (p - uBP) * vec2(1.0, 1.10);

  /* domain warp: whatever is behind this has no shape worth naming */
  vec2 w1 = vec2(fbm2(q*0.23 + sd), fbm2(q*0.23 + sd + 47.9)) - 0.5;
  q += w1 * 7.0;
  vec2 w2 = vec2(fbm2(q*0.55 + uBT*0.30), fbm2(q*0.55 + 91.0 - uBT*0.24)) - 0.5;
  q += w2 * 3.0;

  float r = length(q);

  /* several limbs push at once, none of them centred on anything */
  float h = 0.0;
  for (int k = 0; k < 4; k++){
    float fk = float(k);
    vec2 o = (vec2(hash11(fk*13.7 + sd), hash11(fk*29.3 + sd + 5.0)) - 0.5) * 9.0;
    float s = 0.55 + 1.30*hash11(fk*7.7 + sd + 3.0);
    vec2 an = vec2(1.0 + 0.9*hash11(fk*5.1 + sd), 1.0 - 0.45*hash11(fk*11.3 + sd));
    float rk = length((q - o)*an);
    h += exp(-rk*rk*0.075/s) * (0.40 + 0.75*hash11(fk*3.3 + sd));
  }

  float grain = fbm2(q*0.42 + 21.0);
  float front = uBT*3.0;
  float ring   = exp(-pow(r - front, 2.0)*0.26) * 0.85 * (0.35 + 1.20*grain);
  float ripple = cos(r*2.10 - uBT*7.0 + grain*7.0) * exp(-r*r*0.030) * 0.38;

  /* frayed edge — it tears through rather than bulging out */
  float mask = smoothstep(0.16, 0.68, grain*0.85 + 0.42);
  return (h*mask + ring + ripple) * env * 1.75;
}

/* ---------------- barrier surface ---------------- */
vec3 wall(vec2 p, float foot, float ca, float bh){
  const float P = 0.30;
  float fu = p.x / P;
  float aa = max(foot / P, 0.0006);
  float i  = floor(fu);
  float cab = ca * max(aa, 0.0035) * 1.35;

  vec3 sharp = vec3(0.0);
  vec3 halo  = vec3(0.0);
  vec3 avg   = vec3(0.0);

  for (int j = -4; j <= 4; j++){
    float ci = i + float(j);
    Col  c  = column(ci, p.y);
    float dd = fu - (ci + 0.5);
    float hw = c.w*0.5;

    vec3 cov;
    cov.r = clamp((hw - abs(dd - cab))/aa + 0.5, 0.0, 1.0);
    cov.g = clamp((hw - abs(dd      ))/aa + 0.5, 0.0, 1.0);
    cov.b = clamp((hw - abs(dd + cab))/aa + 0.5, 0.0, 1.0);

    sharp += c.c * cov * c.b;

    /* incandescent core — this is what makes an emitter read as real:
       the centre clips to white, the colour lives in the falloff */
    float inner = clamp((hw*0.42 - abs(dd))/aa + 0.5, 0.0, 1.0);
    sharp += mix(c.c, vec3(1.0, 0.96, 0.94), 0.78) * inner * c.b * 0.32;

    halo += c.c * c.b * (exp(-dd*dd*0.85)*0.030 + 0.0080/(1.0 + dd*dd*0.85));
    avg  += c.c * c.b * c.w;
  }
  avg /= 9.0;

  float m = smoothstep(0.10, 1.05, aa);
  vec3 col = mix(sharp, avg*1.05, m) + halo;

  col += vec3(0.20, 0.012, 0.038) * 0.045 * smoothstep(17.0, 0.4, p.y);

  /* motes hanging in the field */
  vec2 sc = floor(p*1.55);
  float sh = hash21(sc + 5.0);
  vec2  sf = (fract(p*1.55) - vec2(hash21(sc+13.0), hash21(sc+29.0))) / 1.55;
  float sd = length(sf) / max(0.022, foot*0.5);
  col += vec3(0.72, 0.67, 0.78) * step(0.9935, sh) * exp(-sd*sd*1.9)
         * (0.30 + 0.70*hash21(sc+71.0)) * 0.60 * smoothstep(2.0, 9.0, p.y) * (1.0 - m)
         * (1.0 + 3.2*clamp(bh*0.5, 0.0, 1.0));

  /* filaments hauled forward burn hotter, and the crest goes cold-white */
  float g = clamp(bh*0.48, 0.0, 1.0);
  col *= 1.0 + g*1.75;
  col += mix(vec3(1.0, 0.16, 0.26), vec3(0.70, 0.83, 1.0), smoothstep(0.55, 1.0, g)) * g*g * 0.90;
  return col;
}

/* ---------------- the plain in front of it ---------------- */
vec3 ground(vec3 pos, vec3 rd, float foot){
  const float P = 0.30, R = 0.30;
  float z = max(pos.z, 0.0);
  vec2 g  = vec2(pos.x/P, z/R);
  float aa = max(foot/min(P,R), 0.0010);
  vec2 gi = floor(g);
  vec2 gf = fract(g) - 0.5;

  /* plates are laid by hand, not stamped: jitter position and size per cell */
  vec2 off = (vec2(hash21(gi+3.0), hash21(gi+11.0)) - 0.5) * 0.17;
  float rr = 0.120 + 0.085*hash21(gi + 27.0);
  float d  = length((gf - off)*vec2(1.0, 0.88));
  float m  = clamp((rr - d)/aa + 0.5, 0.0, 1.0);
  m = mix(m, PI*rr*rr/0.88, smoothstep(0.30, 1.00, aa));

  /* the plate mirrors the barrier — reflect the view ray and read what it lands on */
  vec3 refl = vec3(0.0);
  vec3 mr = vec3(rd.x, -rd.y, rd.z);
  if (mr.z < -1e-4){
    float tr = -pos.z/mr.z;
    if (tr > 0.0){
      float ci = floor((pos.x + tr*mr.x)/P);
      float wy = tr*mr.y;
      for (int q = -1; q <= 1; q++){
        Col rc = column(ci + float(q), wy);
        refl += rc.c * rc.b;
      }
      refl *= 0.333;
    }
  }

  Col c = column(gi.x, -z*0.9 + 3.0);
  float swell  = 0.60 + 0.40*sin(z*0.80 - uT*0.65 + gi.x*0.045);
  float mottle = 0.50 + 0.50*vnoise(pos.x*0.105 + z*0.06 + uT*0.02);
  float fade   = exp(-z*0.108);

  /* not every plate still fires */
  float live = (0.30 + 0.70*hash21(gi + 53.0)) * step(0.11, hash21(gi + 91.0));
  live *= 0.75 + 0.25*sin(uT*(0.6 + 1.8*hash21(gi + 7.0)) + hash21(gi)*6.3);

  vec3 col = (refl*0.66 + c.c*c.b*0.44) * m * fade * swell * mottle * live;
  col += c.c * c.b * 0.055 * exp(-z*0.75);
  col += refl * 0.045 * exp(-z*0.40);
  return col;
}

/* filmic rolloff — highlights bleach to white instead of clipping to neon */
vec3 aces(vec3 x){
  const float a=2.51, b=0.03, c=2.43, d=0.59, e=0.14;
  return clamp((x*(a*x+b))/(x*(c*x+d)+e), 0.0, 1.0);
}

void main(){
  vec2 frag = gl_FragCoord.xy;
  vec2 uv = (frag - 0.5*uRes) / uRes.y;

  /* transport tear — rare, small */
  float bandH = 6.0 + 30.0*hash11(floor(uT*1.6));
  float band  = floor(frag.y / bandH);
  float slice = floor(uT*8.0);
  float hit   = step(0.9976 - 0.03*uPulse - 0.30*breachEnv(), hash21(vec2(band, slice)));
  uv.x += hit * (hash21(vec2(band*3.7, slice))-0.5) * 0.020 * (1.0-uCalm);

  /* camera: on the plain, oblique to the barrier, handheld */
  float sl = 1.0 - 0.6*uCalm;
  float shx = (vnoise(uT*0.55)-0.5)*0.035 + (vnoise(uT*1.7+9.0)-0.5)*0.012;
  float shy = (vnoise(uT*0.47+31.0)-0.5)*0.028 + (vnoise(uT*1.4+3.0)-0.5)*0.010;
  vec3 ro = vec3(-9.40 + sin(uT*0.043)*0.85*sl, 3.10 + sin(uT*0.061)*0.16*sl, 12.00 + sin(uT*0.029)*0.75*sl);
  vec3 ta = vec3( 0.00 + sin(uT*0.037)*0.95*sl + shx*3.0, 5.24 + sin(uT*0.027)*0.45*sl + shy*3.0, 0.00);
  vec3 ww = normalize(ta - ro);
  vec3 uu = normalize(cross(ww, vec3(0.0,1.0,0.0)));
  vec3 vv = cross(uu, ww);
  float roll = sin(uT*0.021)*0.018*sl;
  const float FOCAL = 0.92;
  vec3 rd = normalize(uv.x*(uu*cos(roll) + vv*sin(roll))
                    + uv.y*(vv*cos(roll) - uu*sin(roll))
                    + FOCAL*ww);

  float px = 1.0/(uRes.y*FOCAL);
  float radial = length(uv);

  float tW = 1e9, tF = 1e9;
  if (rd.z < -1e-4){ float t = -ro.z/rd.z; if (t > 0.0) tW = t; }
  if (rd.y < -1e-4){ float t = -ro.y/rd.y; if (t > 0.0) tF = t; }

  vec3 col = vec3(0.0);
  float t = 1e9;

  if (tF < tW){
    vec3 p = ro + rd*tF;
    col = ground(p, rd, tF*px/max(abs(rd.y), 0.02));
    t = tF;
  } else if (tW < 1e8){
    vec3 p = ro + rd*tW;
    /* defocus grows toward the vanishing edge, like a long lens wide open */
    float foot = tW*px/max(abs(rd.z), 0.02) * (1.0 + 1.30*radial*radial);
    /* the surface now sits at z = h, so re-aim the sample along the ray.
       shear is capped so grazing rays don't smear into liquid */
    vec2 par = rd.xy / rd.z;
    par *= min(1.0, 2.2/max(length(par), 1e-3));

    /* pins, not cloth: snap the displacement to the filament grid up close */
    const vec2 PIN = vec2(0.30, 0.285);
    float qm = smoothstep(0.32, 0.05, foot);
    vec2 wp = p.xy;
    float bh = 0.0;
    for (int it = 0; it < 2; it++){
      vec2 qp = (floor(wp/PIN) + 0.5) * PIN;
      bh = breachH(mix(wp, qp, qm));
      wp = p.xy + par*bh;
    }
    col = wall(wp, foot, 0.45 + 1.15*radial, bh);
    t = tW;
  } else {
    col = vec3(0.0008, 0.0004, 0.0012);
    t = 400.0;
  }

  /* atmosphere: the air in front of it is not empty */
  col *= exp(-t*0.0135);
  col += vec3(0.0078, 0.0007, 0.0027) * (1.0 - exp(-t*0.052));

  /* ---- grade ---- */
  col *= (1.0 + uPulse*0.35) * (0.97 + 0.03*vnoise(uT*0.6));
  col = aces(col * 0.92);
  col = pow(col, vec3(1.0/2.2));

  float lum = dot(col, vec3(0.299, 0.587, 0.114));
  col = mix(vec3(lum), col, 1.05);

  col *= 0.975 + 0.025*sin(frag.y*PI + uT*1.7);
  col += (hash21(frag + fract(uT)*vec2(97.1, 31.7)) - 0.5) * 0.028;
  vec2 q = frag/uRes;
  col *= 0.52 + 0.48*pow(16.0*q.x*q.y*(1.0-q.x)*(1.0-q.y), 0.22);

  col *= uEnter;
  O = vec4(max(col, 0.0), 1.0);
}`;

/* ================================================================
   GL
   ================================================================ */
function compile(type, src){
  const s = gl.createShader(type);
  gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) console.error(gl.getShaderInfoLog(s));
  return s;
}
const prog = gl.createProgram();
gl.attachShader(prog, compile(gl.VERTEX_SHADER, VERT));
gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, FRAG));
gl.linkProgram(prog);
if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) { console.error(gl.getProgramInfoLog(prog)); return; }
gl.useProgram(prog);
gl.bindVertexArray(gl.createVertexArray());

const U = {
  res:   gl.getUniformLocation(prog, "uRes"),
  t:     gl.getUniformLocation(prog, "uT"),
  pulse: gl.getUniformLocation(prog, "uPulse"),
  enter: gl.getUniformLocation(prog, "uEnter"),
  calm:  gl.getUniformLocation(prog, "uCalm"),
  bt:    gl.getUniformLocation(prog, "uBT"),
  bp:    gl.getUniformLocation(prog, "uBP")
};
gl.uniform1f(U.calm, CALM);

function resize(){
  const cap = window.innerWidth < 800 ? 1.15 : 1.35;
  const dpr = Math.min(window.devicePixelRatio || 1, cap);
  const w = Math.max(2, Math.floor(innerWidth * dpr));
  const h = Math.max(2, Math.floor(innerHeight * dpr));
  if (cvs.width !== w || cvs.height !== h){
    cvs.width = w; cvs.height = h;
    gl.viewport(0, 0, w, h);
    gl.uniform2f(U.res, w, h);
  }
}
resize();
addEventListener("resize", resize, { passive:true });

let pulse = 0, enter = 0, clockT = 0, t0 = performance.now(), running = true;
let breachT = -1e4, breachX = 0.0, breachY = 7.0;
function strike(a){ pulse = Math.min(1.3, pulse + a); }

/* rare, and worth waiting for */
function triggerBreach(){
  breachT = clockT;
  breachX = -7.0 + Math.random()*11.0;
  breachY =  3.2 + Math.random()*7.5;
  gl.uniform2f(U.bp, breachX, breachY);
  if (audioReady && AC && AC.state === "running") pressure();
  strike(1.3);
}
function scheduleBreach(){
  setTimeout(() => { triggerBreach(); scheduleBreach(); }, 70000 + Math.random()*110000);
}
setTimeout(() => { triggerBreach(); scheduleBreach(); }, 26000 + Math.random()*22000);

function frame(now){
  if (!running) return;
  clockT = (now - t0) / 1000;
  pulse *= 0.945;
  enter += (1.0 - enter) * 0.0075;
  gl.uniform1f(U.t, clockT);
  gl.uniform1f(U.pulse, pulse);
  gl.uniform1f(U.enter, enter);
  gl.uniform1f(U.bt, clockT - breachT);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

document.addEventListener("visibilitychange", () => {
  running = !document.hidden;
  if (running){ t0 = performance.now() - clockT*1000; requestAnimationFrame(frame); if (AC && audioReady) AC.resume(); }
  else if (AC) AC.suspend();
});

/* ================================================================
   AUDIO — synthesised, no assets, no controls
   ================================================================ */
let AC = null, bus = null, master = null, audioReady = false;

function impulse(dur, decay){
  const rate = AC.sampleRate, len = Math.floor(rate*dur);
  const buf = AC.createBuffer(2, len, rate);
  for (let ch = 0; ch < 2; ch++){
    const d = buf.getChannelData(ch);
    for (let i = 0; i < len; i++) d[i] = (Math.random()*2-1) * Math.pow(1 - i/len, decay);
  }
  return buf;
}
function noiseBuf(sec){
  const rate = AC.sampleRate, len = Math.floor(rate*sec);
  const buf = AC.createBuffer(1, len, rate);
  const d = buf.getChannelData(0);
  let last = 0;
  for (let i = 0; i < len; i++){ const w = Math.random()*2-1; last = (last + 0.02*w)/1.02; d[i] = last*3.5; }
  return buf;
}
function lfo(rate, depth, param, base){
  const o = AC.createOscillator(); o.frequency.value = rate;
  const g = AC.createGain(); g.gain.value = depth;
  o.connect(g); g.connect(param);
  if (base !== undefined) param.value = base;
  o.start(); return o;
}
function panned(node){
  if (AC.createStereoPanner){
    const p = AC.createStereoPanner();
    p.pan.value = Math.random()*1.6 - 0.8;
    node.connect(p); p.connect(bus);
  } else node.connect(bus);
}

function buildAudio(){
  master = AC.createGain(); master.gain.value = 0.0001;
  const comp = AC.createDynamicsCompressor();
  comp.threshold.value = -22; comp.ratio.value = 6; comp.knee.value = 14;
  master.connect(comp); comp.connect(AC.destination);

  /* everything runs through a blanket: no top end escapes */
  const dull = AC.createBiquadFilter();
  dull.type = "lowpass"; dull.frequency.value = 780; dull.Q.value = 0.35;
  const floorCut = AC.createBiquadFilter();
  floorCut.type = "highpass"; floorCut.frequency.value = 30; floorCut.Q.value = 0.5;
  const tilt = AC.createBiquadFilter();
  tilt.type = "highshelf"; tilt.frequency.value = 900; tilt.gain.value = -14;
  dull.connect(floorCut); floorCut.connect(tilt);

  const conv = AC.createConvolver(); conv.buffer = impulse(6.5, 2.2);
  const wet = AC.createGain(); wet.gain.value = 0.55;
  const dry = AC.createGain(); dry.gain.value = 0.85;
  tilt.connect(conv); conv.connect(wet); wet.connect(master);
  tilt.connect(dry); dry.connect(master);
  bus = AC.createGain(); bus.connect(dull);

  /* the slab: inharmonic, no interval anyone could name */
  const df = AC.createBiquadFilter();
  df.type = "lowpass"; df.frequency.value = 200; df.Q.value = 0.6;
  df.connect(bus);
  lfo(0.017, 45, df.frequency, 200);
  [31.70, 38.90, 47.30, 62.10, 31.94].forEach((f, i) => {
    const o = AC.createOscillator();
    o.type = "sine";
    o.frequency.value = f;
    const g = AC.createGain(); g.gain.value = [0.20,0.16,0.13,0.08,0.12][i];
    lfo(0.011 + i*0.006, 0.045, g.gain, g.gain.value);
    lfo(0.024 + i*0.009, 0.30, o.detune, 0);
    o.connect(g); g.connect(df); o.start();
  });

  /* pressure from the far side — low and formless, no rush of air */
  const nz = AC.createBufferSource(); nz.buffer = noiseBuf(8); nz.loop = true;
  const lp = AC.createBiquadFilter(); lp.type = "lowpass"; lp.Q.value = 0.5;
  const ng = AC.createGain();
  nz.connect(lp); lp.connect(ng); ng.connect(bus); nz.start();
  lfo(0.023, 110, lp.frequency, 300);
  lfo(0.009, 0.018, ng.gain, 0.042);

  /* ICE hum — muffled, inharmonic */
  const hf = AC.createBiquadFilter(); hf.type = "lowpass"; hf.frequency.value = 430; hf.Q.value = 1.4;
  const hg = AC.createGain();
  hf.connect(hg); hg.connect(bus);
  [167.0, 244.5, 359.0].forEach((f, i) => {
    const o = AC.createOscillator(); o.type = "triangle"; o.frequency.value = f;
    const g = AC.createGain(); g.gain.value = [0.5,0.26,0.12][i];
    lfo(0.08 + i*0.045, 4.5, o.detune, 0);
    o.connect(g); g.connect(hf); o.start();
  });
  lfo(0.06, 0.012, hg.gain, 0.028);

  master.gain.setValueAtTime(0.0001, AC.currentTime);
  master.gain.exponentialRampToValueAtTime(0.78, AC.currentTime + 14);
  audioReady = true;
}

/* something almost forms a word, then doesn't */
function whisper(){
  const dur = 0.8 + Math.random()*1.3;
  const s = AC.createBufferSource(); s.buffer = noiseBuf(2); s.loop = true;
  const f1 = AC.createBiquadFilter(); f1.type = "bandpass"; f1.Q.value = 5;
  f1.frequency.setValueAtTime(320 + Math.random()*220, AC.currentTime);
  f1.frequency.linearRampToValueAtTime(520 + Math.random()*520, AC.currentTime + dur);
  const g = AC.createGain(); g.gain.value = 0.0001;
  g.gain.exponentialRampToValueAtTime(0.075, AC.currentTime + dur*0.4);
  g.gain.exponentialRampToValueAtTime(0.0001, AC.currentTime + dur);
  s.connect(f1); f1.connect(g); panned(g);
  s.start(); s.stop(AC.currentTime + dur + 0.1);
  strike(0.28);
}

/* something leans on it: a swell of pressure, no pitch to follow */
function pressure(){
  const s = AC.createBufferSource(); s.buffer = noiseBuf(8); s.loop = true;
  const f = AC.createBiquadFilter(); f.type = "lowpass"; f.Q.value = 1.2;
  f.frequency.setValueAtTime(340, AC.currentTime);
  f.frequency.exponentialRampToValueAtTime(85, AC.currentTime + 6.0);
  const g = AC.createGain(); g.gain.value = 0.0001;
  g.gain.exponentialRampToValueAtTime(0.42, AC.currentTime + 2.2);
  g.gain.exponentialRampToValueAtTime(0.0001, AC.currentTime + 7.0);

  const sub = AC.createOscillator(); sub.type = "sine"; sub.frequency.value = 33.0;
  const sg = AC.createGain(); sg.gain.value = 0.0001;
  sg.gain.exponentialRampToValueAtTime(0.16, AC.currentTime + 2.4);
  sg.gain.exponentialRampToValueAtTime(0.0001, AC.currentTime + 7.0);

  s.connect(f); f.connect(g); g.connect(bus);
  sub.connect(sg); sg.connect(bus);
  s.start(); s.stop(AC.currentTime + 7.2);
  sub.start(); sub.stop(AC.currentTime + 7.2);
  strike(0.85);
}

/* the structure settling — a dull knock, unpitched */
function knock(){
  const s = AC.createBufferSource(); s.buffer = noiseBuf(1); s.loop = true;
  const f = AC.createBiquadFilter(); f.type = "lowpass"; f.Q.value = 3.0;
  f.frequency.setValueAtTime(240 + Math.random()*120, AC.currentTime);
  f.frequency.exponentialRampToValueAtTime(70, AC.currentTime + 0.5);
  const g = AC.createGain(); g.gain.value = 0.0001;
  g.gain.exponentialRampToValueAtTime(0.30, AC.currentTime + 0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, AC.currentTime + 1.1);
  s.connect(f); f.connect(g); panned(g);
  s.start(); s.stop(AC.currentTime + 1.3);
  strike(0.55);
}

function scheduleEvents(){
  setTimeout(() => {
    if (audioReady && AC.state === "running"){
      const r = Math.random();
      if (r < 0.62) whisper(); else knock();
    }
    scheduleEvents();
  }, 6000 + Math.random()*16000);
}

function bootAudio(){
  if (AC) { if (AC.state !== "running") AC.resume(); return; }
  try {
    AC = new (window.AudioContext || window.webkitAudioContext)();
    buildAudio();
    scheduleEvents();
    if (AC.state !== "running") AC.resume();
  } catch (e) { /* silent */ }
}
bootAudio();
["pointerdown","keydown","touchstart","wheel"].forEach(ev =>
  addEventListener(ev, bootAudio, { once:true, passive:true }));

})();
</script>
