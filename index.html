<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>diskutabel.com</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
<style>
  html, body { height: 100%; margin: 0; }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    background: #1b1727;
    font-family: "VT323", ui-monospace, Menlo, Consolas, monospace;
  }

  h1 {
    margin: 0;
    font-size: clamp(3rem, 18vw, 9rem);
    font-weight: 400;
    letter-spacing: 0.04em;
    background: linear-gradient(180deg, #ffd166 0%, #ff8c1a 35%, #ff4b1f 65%, #a81208 100%);
    background-size: 100% 240%;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    filter: drop-shadow(0 0 18px rgba(255, 90, 20, 0.45));
    animation: burn 2.6s ease-in-out infinite alternate,
               flicker 4s ease-in-out infinite;
  }

  @keyframes burn {
    from { background-position: 0% 0%; }
    to   { background-position: 0% 100%; }
  }

  @keyframes flicker {
    0%, 100% { filter: drop-shadow(0 0 18px rgba(255, 90, 20, 0.45)); }
    43%      { filter: drop-shadow(0 0 26px rgba(255, 120, 30, 0.6)); }
    47%      { filter: drop-shadow(0 0 12px rgba(255, 70, 10, 0.35)); }
    71%      { filter: drop-shadow(0 0 30px rgba(255, 140, 40, 0.55)); }
  }

  @media (prefers-reduced-motion: reduce) {
    h1 { animation: none; }
  }
</style>
</head>
<body>
  <h1>diskutabel.com</h1>
</body>
</html>
